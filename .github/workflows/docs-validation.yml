name: AEGIS ONE documentation validation

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate_architecture_docs.py"
      - ".github/workflows/docs-validation.yml"
  push:
    branches:
      - main
      - "architecture/**"
    paths:
      - "docs/**"
      - "scripts/validate_architecture_docs.py"
      - ".github/workflows/docs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Validate architecture documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required architecture and governance markers
        run: python scripts/validate_architecture_docs.py
